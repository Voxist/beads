name: voxist-secret-scan

# Voxist-only secret scanning for the Voxist/beads fork (bead vp-ty88y).
#
# This fork tracks gastownhall/beads (upstream) and periodically resyncs
# from it via a `bfork` <- `origin` merge PR. This workflow, its config, and
# its range script all live at paths upstream never touches, so a resync
# never conflicts with them.
#
# The job id — `secret-scan` — IS the contract: a required status-check
# context equals the job name, which defaults to the job id. Do not add a
# `name:` override to the job. This is intended to become a required check
# on this fork's `main` (see docs/voxist-secret-scan.md).
#
# Modeled on voxist-platform's pack-ci secret-scan job and on
# livetranslate-webrtc's ci-floor.yml (bead vc-yb93): the betterleaks CLI
# binary run directly, version-pinned and checksum-verified. No Action
# wrapper: gitleaks-action needs a paid org licence, and the only betterleaks
# action is an unvetted single-maintainer repo.
#
# Nothing here deploys, publishes, or needs a secret beyond GITHUB_TOKEN.
# Every action is SHA-pinned.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: voxist-secret-scan-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secret-scan:
    # No `name:` override — see the header comment above.
    runs-on: ubuntu-24.04
    env:
      BETTERLEAKS_VERSION: "1.3.1"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # Kept at 0 deliberately: the merge-base computation in
          # .github/ci/secret-scan-range.sh needs the full ancestry. The fix
          # for over-broad scanning is the range, not the depth.
          fetch-depth: 0
      - name: Install betterleaks (pinned + checksum-verified)
        run: |
          set -euo pipefail
          BASE="https://github.com/betterleaks/betterleaks/releases/download/v${BETTERLEAKS_VERSION}"
          ASSET="betterleaks_${BETTERLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL "${BASE}/${ASSET}" -o "${ASSET}"
          curl -fsSL "${BASE}/checksums.txt" -o checksums.txt
          grep -F "${ASSET}" checksums.txt | sha256sum -c -
          tar -xzf "${ASSET}"
          sudo install -m 755 betterleaks /usr/local/bin/betterleaks
          betterleaks version
      # Scoped to THIS event's own commits, not the whole repository. An
      # unscoped `betterleaks git .` scans `git log -p --all`, so a required
      # check would fail a PR for findings on unrelated branches (see the
      # range script's header for the measured incident this avoids).
      # Scoping changes only which event a finding lands on, never whether
      # it is found: every commit is in exactly one PR range and one push
      # range.
      - name: Scan this event's own commits for secrets
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          range="$(bash .github/ci/secret-scan-range.sh)"
          echo "scanning range: ${range}"
          betterleaks git . --config .betterleaks.toml --log-opts="${range}"
